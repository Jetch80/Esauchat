DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esau Chat</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f1f1;
    }

    .app {
      max-width: 500px;
      margin: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: white;
    }

    header {
      background: #1877f2;
      color: white;
      padding: 18px;
      font-size: 22px;
      font-weight: bold;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      background: #e4e6eb;
      padding: 10px 14px;
      border-radius: 15px;
      margin-bottom: 10px;
      max-width: 75%;
    }

    .name {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .bottom {
      display: flex;
      padding: 10px;
      gap: 8px;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 20px;
      background: #1877f2;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <header>💬 Esau Chat</header>

  <div id="messages"></div>

  <div class="bottom">
    <input id="messageInput" placeholder="Type a message...">
    <button id="sendButton">Send</button>
  </div>

</div>

<script type="module">

  import { initializeApp } from
  "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
  } from
  "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyAZBZ8Qv_YeFoyKs8icWIDkXaXVn6hRje8",
    authDomain: "veritas-7e1d7.firebaseapp.com",
    projectId: "veritas-7e1d7",
    storageBucket: "veritas-7e1d7.firebasestorage.app",
    messagingSenderId: "693183292553",
    appId: "1:693183292553:web:4a8a147f9fdc3960311258"
  };


  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const messagesRef = collection(db, "messages");

  const messagesQuery = query(
    messagesRef,
    orderBy("time", "asc")
  );


  const messagesBox = document.getElementById("messages");
  const input = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");


  sendButton.addEventListener("click", async () => {

    const text = input.value.trim();

    if (!text) return;

    await addDoc(messagesRef, {
      name: "Esau",
      text: text,
      time: serverTimestamp()
    });

    input.value = "";
  });


  onSnapshot(messagesQuery, (snapshot) => {

    messagesBox.innerHTML = "";

    snapshot.forEach((doc) => {

      const data = doc.data();

      const message = document.createElement("div");
      message.className = "message";

      message.innerHTML = `
        <div class="name">${data.name || "User"}</div>
        <div>${data.text || ""}</div>
      `;

      messagesBox.appendChild(message);
    });

    messagesBox.scrollTop = messagesBox.scrollHeight;
  });

</script>

</body>
</html>
