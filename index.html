<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esau Chat</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f2f2f2;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #chat {
      display: none;
    }

    #messages {
      height: 400px;
      overflow-y: auto;
      background: white;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .message {
      padding: 10px;
      margin-bottom: 8px;
      background: #eeeeee;
      border-radius: 8px;
    }

    .name {
      font-weight: bold;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="login">
    <h1>💬 Esau Chat</h1>

    <input
      type="text"
      id="nameInput"
      placeholder="Enter your name"
    >

    <button id="joinButton">
      Join Chat
    </button>
  </div>


  <div id="chat">

    <h1>💬 Esau Chat</h1>

    <div id="messages"></div>

    <input
      type="text"
      id="messageInput"
      placeholder="Type a message..."
    >

    <button id="sendButton">
      Send
    </button>

  </div>

</div>


<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp,
    query,
    orderBy,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyAZBZ8Qv_YeFoyKs8icWIDkXaXVn6hRje8",
    authDomain: "veritas-7e1d7.firebaseapp.com",
    projectId: "veritas-7e1d7",
    storageBucket: "veritas-7e1d7.firebasestorage.app",
    messagingSenderId: "693183292553",
    appId: "1:693183292553:web:4a8a147f9fdc3960311258"
  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);

  const messagesRef = collection(db, "messages");


  let currentName = "";


  const nameInput = document.getElementById("nameInput");
  const joinButton = document.getElementById("joinButton");

  const login = document.getElementById("login");
  const chat = document.getElementById("chat");

  const messagesBox = document.getElementById("messages");
  const input = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");


  joinButton.addEventListener("click", () => {

    const name = nameInput.value.trim();

    if (!name) {
      alert("Please enter your name.");
      return;
    }

    currentName = name;

    login.style.display = "none";
    chat.style.display = "block";

  });


  const messagesQuery = query(
    messagesRef,
    orderBy("time", "asc")
  );


  sendButton.addEventListener("click", async () => {

    const text = input.value.trim();

    if (!text) return;

    await addDoc(messagesRef, {

      name: currentName,

      text: text,

      time: serverTimestamp()

    });

    input.value = "";

  });


  onSnapshot(messagesQuery, (snapshot) => {

    messagesBox.innerHTML = "";

    snapshot.forEach((doc) => {

      const data = doc.data();

      const message = document.createElement("div");

      message.className = "message";

      message.innerHTML = `
        <div class="name">${data.name || "User"}</div>
        <div>${data.text || ""}</div>
      `;

      messagesBox.appendChild(message);

    });

    messagesBox.scrollTop = messagesBox.scrollHeight;

  });

</script>

</body>
</html>
